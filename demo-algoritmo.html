<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo · Cómo funciona el Algoritmo</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --teal: #05A696;
    --gold: #BF9445;
    --navy: #143F59;
    --paper: #FAF7F0;
    --line: #E0DCD0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  
  /* Barra superior de "Video" */
  .video-controls {
    padding: 1rem 2rem;
    background: #0b1120;
    border-bottom: 1px solid #1e293b;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .progress-bar {
    flex: 1;
    height: 4px;
    background: #334155;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--teal);
    width: 0%;
    transition: width 1s linear;
  }
  .status-text {
    font-family: monospace;
    color: var(--teal);
    font-size: 0.85rem;
    width: 150px;
  }

  /* Contenedor principal */
  .split-screen {
    display: grid;
    grid-template-columns: 1fr 1fr;
    flex: 1;
    overflow: hidden;
  }

  /* LADO IZQUIERDO: El Navegador */
  .browser-side {
    padding: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid #1e293b;
  }
  .browser {
    width: 100%;
    max-width: 480px;
    height: 400px;
    background: var(--paper);
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .browser__url {
    background: #e2e8f0;
    padding: 0.75rem 1rem;
    border-radius: 12px 12px 0 0;
    font-family: monospace;
    font-size: 0.8rem;
    color: #334155;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    border-bottom: 1px solid #cbd5e1;
  }
  .browser__url::before {
    content: '';
    width: 10px; height: 10px; border-radius: 50%;
    background: #ef4444; box-shadow: 16px 0 0 #f59e0b, 32px 0 0 #10b981;
    margin-right: 2rem;
  }
  .browser__content {
    flex: 1;
    padding: 2rem;
    color: var(--navy);
    transition: opacity 0.5s ease;
  }
  .page-title {
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 1rem;
    letter-spacing: -0.03em;
  }
  .page-text {
    font-size: 1rem;
    line-height: 1.6;
    color: #4A6B82;
  }

  /* La Alerta (Toast) */
  .toast {
    position: absolute;
    top: 60px;
    right: 16px;
    width: 260px;
    background: #fff;
    border-left: 4px solid var(--teal);
    border-radius: 8px;
    padding: 1rem;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    display: flex;
    gap: 0.75rem;
    opacity: 0;
    transform: translateX(20px);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
    overflow: hidden;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(0);
  }
  .toast__icon {
    width: 32px; height: 32px;
    background: rgba(5, 166, 150, 0.1);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--teal);
  }
  .toast__content { flex: 1; }
  .toast__label {
    font-family: monospace; font-size: 0.55rem; color: var(--gold);
    text-transform: uppercase; letter-spacing: 0.1em; font-weight: bold;
  }
  .toast__title { font-size: 0.85rem; font-weight: 800; color: var(--navy); margin: 0.2rem 0; }
  .toast__text { font-size: 0.75rem; color: #64748b; line-height: 1.4; }
  .toast__progress {
    position: absolute; bottom: 0; left: 0; height: 3px; background: var(--teal);
    width: 100%; animation: progress 7s linear forwards;
  }
  @keyframes progress { to { width: 0%; } }


  /* LADO DERECHO: El Cerebro (Algoritmo) */
  .brain-side {
    padding: 2rem;
    background: #0b1120;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }
  .panel {
    background: var(--panel);
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 1.5rem;
    font-family: monospace;
    font-size: 0.85rem;
  }
  .panel h3 {
    color: var(--muted);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 1rem;
    border-bottom: 1px solid #334155;
    padding-bottom: 0.5rem;
  }
  .storage-item {
    color: #38bdf8;
    margin-bottom: 0.5rem;
    padding-left: 1rem;
    position: relative;
  }
  .storage-item::before { content: '└─'; position: absolute; left: 0; color: #475569; }
  
  .logic-log { display: flex; flex-direction: column; gap: 0.5rem; }
  .logic-step {
    color: #94a3b8;
    opacity: 0;
    transform: translateY(5px);
    transition: all 0.3s ease;
  }
  .logic-step.active {
    opacity: 1;
    transform: translateY(0);
  }
  .logic-step.highlight { color: #4ade80; }
  .logic-step.error { color: #f87171; }

</style>
</head>
<body>

  <div class="video-controls">
    <div class="status-text" id="statusText">Iniciando...</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="split-screen">
    <!-- Lado Izquierdo -->
    <div class="browser-side">
      <div class="browser">
        <div class="browser__url" id="browserUrl">https://alexworkspace.com/index.html</div>
        <div class="browser__content" id="browserContent">
          <h1 class="page-title" id="pageTitle">Inicio</h1>
          <p class="page-text" id="pageText">Bienvenido a Alex Workspace.</p>
        </div>
        
        <!-- Componente Toast -->
        <div class="toast" id="toast">
          <div class="toast__icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 012-2h12a2 2 0 012 2v14"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
          </div>
          <div class="toast__content">
            <div class="toast__label">Recomendado para ti</div>
            <div class="toast__title" id="toastTitle">¿Buscas más opciones?</div>
            <div class="toast__text" id="toastText">Explora la Unidad de Becas completa.</div>
          </div>
          <div class="toast__progress" id="toastProgress"></div>
        </div>
      </div>
    </div>

    <!-- Lado Derecho -->
    <div class="brain-side">
      
      <!-- Memoria LocalStorage -->
      <div class="panel">
        <h3>Memoria en Caché (localStorage)</h3>
        <div id="storageHistory">
          <div style="color: #475569; font-style: italic;">El historial está vacío...</div>
        </div>
      </div>

      <!-- Lógica del Algoritmo -->
      <div class="panel" style="flex: 1;">
        <h3>Lógica del Algoritmo</h3>
        <div class="logic-log" id="logicLog">
          <div style="color: #475569; font-style: italic;">Esperando datos...</div>
        </div>
      </div>

    </div>
  </div>

<script>
  const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

  // Elementos del DOM
  const elUrl = document.getElementById('browserUrl');
  const elTitle = document.getElementById('pageTitle');
  const elText = document.getElementById('pageText');
  const elHistory = document.getElementById('storageHistory');
  const elLogic = document.getElementById('logicLog');
  const elStatus = document.getElementById('statusText');
  const elProgress = document.getElementById('progressFill');
  const elToast = document.getElementById('toast');

  // Estado de la simulación
  let history = [];
  let currentPath = '';

  // Base de datos de páginas y recomendaciones
  const PAGES = {
    'index': { title: 'Inicio', text: 'Bienvenido a Alex Workspace.' },
    'univo': { title: 'Becas UNIVO', text: 'Programa de becas de la Universidad de Oriente...' },
    'proyectos': { title: 'Proyectos', text: 'Heliot Media, Windsor y The New Key.' },
    'unidad-de-becas': { title: 'Unidad de Becas', text: 'Todas las convocatorias activas.' }
  };

  const RECOMMENDATION_MAP = {
    'univo': { target: 'unidad-de-becas', title: '¿Buscas más opciones?', text: 'Explora la Unidad de Becas completa.' },
    'proyectos': { target: 'unidad-de-emprendimiento', title: '¿Quieres crear tu propio proyecto?', text: 'Aprende el método en la Unidad de Emprendimiento.' }
  };

  // Función para actualizar la vista del navegador
  function updateBrowser(pageKey) {
    currentPath = pageKey;
    const page = PAGES[pageKey];
    elUrl.textContent = `https://alexworkspace.com/${pageKey}.html`;
    elTitle.textContent = page.title;
    elText.textContent = page.text;
    
    // Efecto visual de carga
    elTitle.parentElement.style.opacity = '0';
    setTimeout(() => { elTitle.parentElement.style.opacity = '1'; }, 50);
  }

  // Función para actualizar la vista de la caché
  function updateHistoryUI() {
    if (history.length === 0) {
      elHistory.innerHTML = '<div style="color: #475569; font-style: italic;">El historial está vacío...</div>';
      return;
    }
    elHistory.innerHTML = history.map(h => `<div class="storage-item">"${h}"</div>`).join('');
  }

  // Función para actualizar la lógica visual
  function addLogicStep(text, type = '') {
    const div = document.createElement('div');
    div.className = `logic-step ${type}`;
    div.textContent = text;
    elLogic.appendChild(div);
    setTimeout(() => div.classList.add('active'), 50);
    elLogic.scrollTop = elLogic.scrollHeight;
  }

  function clearLogic() {
    elLogic.innerHTML = '';
  }

  // Función para actualizar la barra de progreso del video
  function setVideoProgress(percent) {
    elProgress.style.width = percent + '%';
  }

  // --- EL GUIÓN DE LA PELÍCULA ---
  async function playSimulation() {
    
    // 1. Inicio
    elStatus.textContent = "Simulando navegación...";
    history = [];
    updateHistoryUI();
    updateBrowser('index');
    history.push('index');
    updateHistoryUI();
    setVideoProgress(10);
    await sleep(2000);

    // 2. Visita a UNIVO
    setVideoProgress(20);
    updateBrowser('univo');
    history.push('univo');
    updateHistoryUI();
    await sleep(2500);

    // 3. Visita a PROYECTOS
    setVideoProgress(40);
    updateBrowser('proyectos');
    history.push('proyectos');
    updateHistoryUI();
    await sleep(2000);

    // 4. Inicia el Algoritmo
    setVideoProgress(50);
    elStatus.textContent = "Ejecutando Algoritmo...";
    clearLogic();
    addLogicStep('> Iniciando motor de recomendación...');
    await sleep(1000);

    // Paso A: Leer historial
    addLogicStep(`> Leyendo historial: [${history.join(', ')}]`);
    await sleep(1500);

    // Paso B: Cruzar datos
    addLogicStep('> Buscando coincidencias en el mapa de relaciones...');
    await sleep(1500);

    let validRecs = [];
    history.forEach(past => {
      if (RECOMMENDATION_MAP[past]) {
        addLogicStep(`  - Encontrado: "${past}" recomienda ir a "${RECOMMENDATION_MAP[past].target}"`, 'highlight');
        validRecs.push(RECOMMENDATION_MAP[past]);
      }
    });
    await sleep(1500);

    // Paso C: Filtrar
    addLogicStep('> Filtrando páginas ya visitadas o actuales...');
    await sleep(1000);
    
    let finalRecs = validRecs.filter(rec => {
      if (history.includes(rec.target) || rec.target === currentPath) {
        addLogicStep(`  - Descartado: "${rec.target}" (ya fue visitado)`, 'error');
        return false;
      }
      addLogicStep(`  - Aprobado: "${rec.target}"`, 'highlight');
      return true;
    });
    await sleep(1500);

    // Paso D: Elegir
    if (finalRecs.length > 0) {
      setVideoProgress(80);
      const chosen = finalRecs[Math.floor(Math.random() * finalRecs.length)];
      addLogicStep(`> Seleccionando recomendación: "${chosen.target}"`, 'highlight');
      
      // Mostrar Toast
      elToastTitle.textContent = chosen.title;
      elToastText.textContent = chosen.text;
      elToast.style.pointerEvents = 'auto';
      elToast.classList.add('show');
      elToastProgress.style.animation = 'none'; // Reset animation
      void elToastProgress.offsetWidth; // Trigger reflow
      elToastProgress.style.animation = 'progress 7s linear forwards';

      await sleep(3000);
    } else {
      addLogicStep('> No hay recomendaciones válidas nuevas.', 'error');
    }

    // 5. Fin
    setVideoProgress(100);
    elStatus.textContent = "Simulación completada.";
    await sleep(3000);
    
    // Ocultar Toast
    elToast.classList.remove('show');
    
    // Reiniciar bucle
    setVideoProgress(0);
    await sleep(1000);
    playSimulation();
  }

  // Iniciar al cargar
  window.onload = playSimulation;

</script>
</body>
</html>
